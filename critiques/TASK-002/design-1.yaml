      작은 텍스트 AA 미달이다(DESIGN.md 에 PROPOSED 로 인정됨).
    impact: >-
      C.danger 는 F.xs(12px) 로도 쓰인다(power.ts 정전 이력). 배경이 C.slot 인 요소 위에
      danger 텍스트를 올리면 읽기 어렵다. 시연 환경 조명에서 더 나빠진다.
    verification: >-
      상대휘도 공식으로 계산. text #fff 17.76 / textMuted 7.35 / accent 10.42 /
      success 8.45 / warn 6.24 / danger 4.65 / textFaint 3.16 (모두 C.bg 기준).
    suggested_fix: >-
      C.danger 를 밝게 조정하거나(예 #ff6b5c 계열은 대비가 더 높다), 작은 텍스트에는
      danger 를 쓰지 않는 규칙을 DESIGN.md 에 명시한다. 실측값을 DESIGN.md 접근성 절에 적어둔다.

