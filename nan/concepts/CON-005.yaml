approvedBy: yeomyooncheol
notes: |
  사용자가 주제 "축구 코너킥"과 역할 분담(한 명이 올리고 한 명이 넣는다, 수비수·골키퍼는
  AI 가 막는다)을 지정했다. 이 문서가 정한 것은 그 위의 구조다.

  ## 이 게임이 이 저장소에 주는 것

  - **범인 다툼이 주제에 내장돼 있다.** 실패한 코너킥 뒤에 키커와 스트라이커가 서로를
    탓하는 것은 축구의 실제 풍경이다. 지금까지 게임마다 따로 만들어 붙이던 "범인 특정"이
    또 한 번 규칙에서 공짜로 나온다(CON-004 가 제로섬에서 얻은 것과 같은 종류다).
  - **협동인데 개인 기여가 갈린다.** 리듬(CON-001)은 협동이지만 실패가 팀 전체 손해라
    누구 탓인지 흐려졌고 그래서 DEC-ACCURACY 로 개인 적중률을 따로 뽑아야 했다. 코너킥은
    한 코너에 역할이 둘뿐이라 분리가 자동이다.
  - **첫 실시간 자유이동 게임.** 리듬은 실시간이지만 노트가 정해진 트랙을 따라간다.
    여기서 처음으로 임의 좌표를 움직이는 물체를 다룬다.

  ## 인과 사슬 — 이 게임의 중심 아이디어

  P1 의 파워 정확도가 **낙하 원의 초기 반경**을 정한다. 완벽하면 처음부터 점이고,
  나쁘면 큰 원이 착지 직전까지 안 좁혀진다. 즉 **키커의 실력이 헤더의 난이도가 된다.**

  이 하나로 세 가지가 동시에 풀린다.
  - **정보 비대칭 없이 긴장이 생긴다.** P2 가 P1 의 조준을 봐도 소용없다 — 실제 낙하점은
    원 안 어딘가다. 핫시트에서 화면을 가릴 필요가 없다.
  - **범인이 기계적으로 정해진다.** 원이 컸는데 못 넣었으면 공이 나빴고, 원이 작았는데
    못 넣었으면 늦게 붙은 것이다. 사람이 판정할 필요가 없다.
  - **랜덤과 결정이 분리된다.** 흩어짐은 랜덤, 어디로 올릴지와 어디로 뛸지는 결정이다 —
    CON-003(떠넘기기)·CON-004(제로섬)가 쓴 구조와 같다.

  ## 실패 사유는 이름으로 적는다

  퍼센트를 보여주지 않는다(MIM-001 이 퍼센트 페이오프로 취소된 전례). 판정은 전부
  화면에 보이는 것으로 결정하고, 결과는 문장으로 적는다.

  - `공이 나빴다` — 원이 끝까지 컸다. 키커 탓
  - `늦게 붙었다` — 원이 작았는데 착지 때 P2 가 멀었다. 헤더 탓
  - `머리 타이밍` — 자리에는 있었는데 점프 창을 놓쳤다. 헤더 탓
  - `수비가 먼저 봤다` — 착지 때 수비수가 더 가까웠다. 위험 지역을 고른 키커 탓에 가깝다
  - `골키퍼가 나왔다` — 낙하점이 GK 출동 존 안이었다. 키커 탓

  ## 딜레마는 설계하지 않아도 생긴다

  골문 앞은 헤딩이 쉽지만 GK 가 나와서 먹는다. 멀리 올리면 GK 는 안 나오지만 수비수가
  붙을 시간이 생기고 각도가 나빠진다. GK 출동 존 하나가 규칙이고 딜레마는 그 부산물이다.

  ## 수비 AI 는 사람이 아니라 공을 본다

  수비수는 P2 를 마크하지 않고 **낙하 원의 중심으로 달린다.** 이유가 둘이다.
  - 축구가 그렇다. 공중볼에서 수비수도 낙하점을 본다.
  - P2 를 추적하면 AI 가 P2 를 영원히 따라다녀 게임이 술래잡기가 된다. 같은 목표점을
    향해 달리는 경주여야 "반 발 먼저"가 성립한다.

  AI 는 별도 코어 시스템으로 세지 않는다. 수비수는 "원 중심으로 속도 v 이동", 골키퍼는
  "낙하점이 존 안이면 낙하점으로, 아니면 골라인 유지" — 합쳐서 규칙 몇 줄이다.
  `newCoreSystems` 가 `corner` 하나인 이유다.

  ## 역할 교대와 점수

  코너 6개, 각자 키커 3번. 팀 골 수가 성적이고 개인 기여는 `내가 올린 3개 중 2골` 처럼
  모수와 함께 적는다(DESIGN.md 원칙 4). 승패를 가르지 않는 협동이지만 비교는 남는다.

  ## 쇼츠각 4항목 점검

  1. **punchline 프레임** — 골망이 흔들리는 순간, 또는 GK 주먹에 공이 튕기는 순간.
     0.5초 안에 판독된다. 지금까지 만든 것 중 punchline 이 가장 명확하다.
  2. **매판 다른 클립** — 흩어짐·낙하점·수비 위치가 매번 다르다. 다만 **떠넘기기에서 배운
     함정**(변주가 결과에만 있고 상황에는 없음)이 여기서도 위험하다. 상황 변주 후보는
     공짜로 많다 — 좌/우 코너, 수비 인원, 인스윙/아웃스윙, 니어/파 포스트, 비 오는 날
     미끄러운 공. 전부 세로 조각 다음이다.
  3. **범인 로테이션** — 역할이 코너마다 바뀌고 실패 사유가 이름으로 찍힌다.
  4. **페이오프가 숫자가 아니다** — 골망이다.

  ## 세로 조각의 경계 — 6시간 안에 드는 것과 안 드는 것

  `vertical-slice-in-six-hours: true` 는 **아래 조각에 대해서만** 참이다. 전체 게임이
  아니다. 이 경계를 지키지 못하면 하드게이트를 거짓으로 통과한 것이 된다.

  **넣는다** — 왼쪽 코너 고정 · 수비수 1명 · 골키퍼 1명 · 낙하 원 수축 · 헤딩 판정 ·
  실패 사유 5종 · 코너 6개와 역할 교대. 여기까지가 "인과 사슬"을 증명하는 최소치다.

  **뺀다** — 좌우 코너 선택, 수비 인원 변화, 인스윙/아웃스윙, 세컨드볼, 리바운드,
  오프사이드, 애니메이션 스프라이트, 관중·사운드. 상황 변주(쇼츠 2번 항목)는
  세로 조각이 재미있다는 판정을 받은 다음이다 — 떠넘기기에서 규칙 8종을 한 번에 넣었다가
  하나가 첫 플레이에 걸러진 전례(PSH-003)를 반복하지 않는다.

  ## 미해결 — 사람이 플레이해야 답이 나오는 것

  - **feasibility 15 가 이 컨셉의 가장 큰 약점이다.** 포물선 + 자유이동 3체 + 충돌 판정을
    한 번에 만든다. 조각을 위처럼 깎아서 6시간에 든다고 봤지만, 지금까지 만든 어떤
    게임보다 크다는 사실은 그대로다.
  - **visualClarity 11.** 조각에서도 동시에 움직이는 것이 공·그림자·헤더·수비수·골키퍼·
    낙하 원으로 여섯이다. 이 저장소는 **정적** 화면에서도 겹침 버그를 네 번 냈다(TASK-010~013).
    움직이는 화면에서는 좌표 산술 테스트가 더 무력하다 — 이건 알고 들어가는 위험이다.
  - **높이를 그림자로만 표현하는 것이 통하는지 모른다.** 공과 그림자의 거리가 높이이고
    둘이 만나는 순간이 착지다. 판독되면 우아하고 안 되면 게임이 안 읽힌다. 대안(공 크기
    변화, 옆에서 본 궤적 미니뷰)은 있지만 화면을 더 어지럽힌다.
  - **협동이 대결보다 심심할 수 있다.** 이 저장소의 게임 4종 중 협동은 리듬 하나고
    나머지는 전부 대결이다. 범인 다툼이 그 자리를 메울 것으로 봤지만 확신은 없다.
  - **P1 조준 중 P2 가 할 일이 없다.** 2초 안에 끝나면 문제없지만 계측하지 않았다.
  - 수치 전부 — 원의 초기 반경과 수축 속도, 수비수 속도 대 헤더 속도, GK 출동 존 크기,
    점프 창, 코너 6개. 근거 없이 고른다. 이 게임은 이 값들이 곧 재미다.
  - **novelty 6 으로 이 저장소 최저다.** 축구 게임은 흔하다. 새로움이 강점이 아니고,
    강점은 역할 분리에서 나오는 범인 구조와 punchline 의 명확성이다.

  ## 점수가 낮은 것을 숨기지 않는다

  합계 78 은 CON-001(88)·CON-003(88)·CON-004(89)보다 한참 낮다. feasibility 와
  visualClarity 에서 깎였고 그 둘이 실제 위험이다. 그럼에도 만드는 이유는 punchline 이
  가장 명확하고(쇼츠 1번 항목) 범인 구조가 주제에 붙어 있기 때문이다. 승인하면
  **세로 조각을 최대한 깎아** 위험을 먼저 확인하는 방식으로 간다.

  작업 ID 계열은 `COR-###`. `TASK-`(하네스·리듬)·`MIM-`(모방)·`PSH-`(떠넘기기)·
  `ZRO-`(제로섬)와 가른다.

  승인 (2026-07-31, yeomyooncheol): 세로 조각 경계를 그대로 두고 승인했다. 제시한 세 안
  중 "조각 그대로"(수비수 1 + GK 1)를 골랐고, 더 깎는 안(GK 만)은 선택되지 않았다.

  **승인 시점에 사용자가 본 것은 평문 요약이다** — 파워 정확도가 원 반경을 정한다는 인과,
  수비 AI 가 사람이 아니라 원 중심을 쫓는다는 것, GK 출동 존이 만드는 딜레마, 실패 사유
  5종, 점수 78 과 그 이유. 수치(반경·수축 속도·이동 속도·존 크기·점프 창)는 아무것도
  확정되지 않았고 승인이 그것들을 검증했다는 뜻이 아니다. 미해결 6건은 세로 조각을
  사람이 플레이해야 답이 나온다.
