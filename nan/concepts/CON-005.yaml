id: CON-005
title: 코너킥 — 올린 공이 나빴나, 못 넣은 놈이 나빴나
summary: >-
  한 명은 낙하지점을 정해 공을 올리고, 다른 한 명은 좁혀지는 낙하 원을 보고 뛰어들어 헤딩한다.
  수비수와 골키퍼는 규칙으로 움직이며 같은 지점을 노린다. 실패하면 화면이 범인을 이름으로 적는다.
tags: [simple, 2d, web, hotseat, coop, realtime, physics, football, shorts-first]
axes:
  space: 페널티 박스 평면 640×480 — 위가 골문, 좌우 상단이 코너. 높이는 공과 그림자의 거리로만 표현한다
  coreVerb: >-
    키커 = 낙하점 클릭 + 파워 게이지 정지 (조작 2종).
    헤더 = 방향 이동 + 점프 (조작 2종). 한 사람이 동시에 두 역할을 하지 않는다
  systemBehavior: >-
    파워 정확도가 낙하 원의 초기 반경을 정하고, 공이 나는 동안 원이 좁혀진다.
    수비 AI 는 원의 중심을 추적한다 — 사람이 아니라 공을 본다
  pressure: 원이 좁혀지는 속도 대 뛰어가는 속도. 늦게 확신하면 못 가고, 일찍 뛰면 틀린 곳에 선다
  themeCoupling: >-
    코너킥을 빼면 "낙하지점"이라는 개념 자체가 없어진다. 공중볼 경합은 실제로 낙하점 예측
    싸움이고, 골키퍼가 나올지 말지 갈리는 존이 골문 앞에 실재하며, 키커와 스트라이커가
    서로를 탓하는 것도 실제 코너킥의 풍경이다. 셋 다 이 게임의 규칙 그대로다
  visualReward: >-
    골망이 흔들린다. 실패하면 공이 튕겨 나간다. 숫자가 아니라 그림이 페이오프다
representativeScene: >-
  P1 이 골문 앞 위험 지역을 피해 파포스트로 올린다. 파워를 살짝 놓쳐 낙하 원이 크게 뜬다.
  P2 가 원 가운데로 먼저 뛰지만 원이 좁혀지며 왼쪽으로 밀린다 — 수비수도 같은 방향으로 돈다.
  P2 가 반 발 먼저 닿아 점프, 헤딩이 골키퍼 손끝을 넘어 꽂힌다. P1 이 "내가 잘 올렸지" 하고
  P2 가 "그게 잘 올린 거냐" 한다. 화면에는 `공 오차 컸음 · 헤더가 살렸다` 가 적힌다.
