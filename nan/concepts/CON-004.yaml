approvedBy: yeomyooncheol
notes: |
  사용자가 주제 "제로섬"을 정하고, 제로섬을 어디에 걸지 세 방향(점수가 오간다 /
  자리를 뺏는다 / 시간을 뺏는다) 중 **자리**를 골랐다. 칸 수가 고정이라 총합이
  저절로 0이 되므로 규칙을 따로 만들 필요가 없다.

  제로섬이 이 저장소에 주는 것 — 공짜로 얻는 두 가지:
  - **범인이 구조적으로 항상 명확하다.** 내가 잃은 1칸은 반드시 네가 가져간 1칸이다.
    지금까지 게임마다 따로 만들어 붙이던 "범인 특정"이 규칙에 내장돼 있다.
  - **막대 하나가 곧 판세다.** 총합이 불변이라 경계선 하나로 전부 표현된다.
    자막도 설명도 필요 없다 — 경계가 어느 쪽으로 밀렸는지만 보면 된다.

  **처음부터 꽉 찬 판.** 빈 판에서 시작하면 초반이 제로섬이 아니다(빈 칸은 누구 것도
  아니다). 70 대 70 으로 채워두면 1턴부터 모든 수가 순수한 강탈이다.

  제로섬의 함정과 대응:
  - **순수 제로섬 + 완전정보 = 계산으로 풀린다.** 틱택토처럼 최적해가 존재한다.
    → 매 턴 **무작위 반경**(1~3)을 준다. 랜덤(반경)과 결정(자리)이 분리된다 —
      떠넘기기(CON-003)에서 쓴 구조와 같다.

  설계에서 먼저 막은 붕괴:
  - **최종 판만 세면 마지막에 두는 사람이 유리하다.** 마지막 수는 반격을 안 받는다.
  - **서로 되받아치면 초반 수가 전부 무의미해진다.** 반경 운으로만 결판난다.
    → 둘 다 **매 턴 끝에 자기 칸 수만큼 점수를 받는 것**으로 막는다. 오래 들고 있는
      것이 값이 되므로 초반 수가 살아나고 마지막 수의 특권이 희석된다.
    → 부수 효과: 주제가 더 순수해진다. 매 턴 고정된 파이(140칸)를 둘이 나눠 갖는다 —
      점수도 매 턴 총합이 불변이라 여전히 제로섬(정확히는 상수합, 전략적으로 동치)이다.

  딜레마는 설계하지 않아도 생긴다:
  - 크게 뭉쳐 먹으면 **그 자리가 그대로 과녁**이 된다. 상대가 같은 곳을 치면 한 방에
    다 잃는다. 분산하면 안전하지만 느리다. 반경이 규칙이고 딜레마는 그 부산물이다.

  쇼츠각 4항목 점검:
  1. punchline 프레임 — 한 수에 25칸이 넘어가며 막대 경계가 밀리는 순간. 격자 색과
     막대 하나라 2초 판독.
  2. 매판 다른 클립 — 판 배치·반경 순서가 매판 다르다. 다만 **떠넘기기에서 배운 함정**
     (변주가 결과에만 있고 상황에는 없음)을 여기서도 경계해야 한다. 라운드 규칙 같은
     상황 변주는 세로 조각 다음이다.
  3. 범인 로테이션 — 규칙에 내장돼 있다. 뺏은 사람이 매 수 바뀐다.
  4. 페이오프가 숫자가 아니다 — 경계가 밀리는 그림이다. 숫자는 부차 신호.

  미해결 — 사람 판단이 필요한 것:
  - **핑퐁.** 같은 자리를 서로 계속 되받아치면 판이 안 움직이고 지루해진다. 반경이 매 턴
    다르고 되받아칠 때 이미 내 것인 칸이 섞여 이득이 줄어들므로 저절로 잦아들 것으로
    봤지만 확신은 없다. 심하면 "뺏은 칸은 한 턴 잠긴다"를 넣는다(지금은 YAGNI).
  - **반경 운.** 큰 반경을 연달아 받은 쪽이 유리하다. 매 턴 점수가 이를 얼마나 눌러주는지
    모른다. 심하면 반경을 양쪽에 같은 순서로 주는(대칭 시드) 방법이 있다.
  - 판 크기 14×10, 반경 1~3(5·13·25칸), 턴 수, 반경 분포 — 전부 근거 없이 고른 값이다.
  - novelty 9 로 낮다. 리버시 계열이고 새로움이 강점이 아니다 — 강점은 주제와 메커니즘이
    완전히 같다는 것(theme 28)과 막대 하나로 끝나는 판독성이다.

  작업 ID 계열은 `ZRO-###`. `TASK-`(하네스·리듬)·`MIM-`(모방)·`PSH-`(떠넘기기)와 가른다.

  승인 (2026-07-30, yeomyooncheol): 방향과 루프를 승인했다. 승인 시점에 사용자가 본 것은
  평문 설명(꽉 찬 판·막대 하나·무작위 반경·뭉치면 과녁)이고, 매 턴 점수와 수치·점수
  산정은 이 문서에서 처음 확정됐다. 미해결 4건은 세로 조각에서 사람이 플레이해야
  답이 나온다 — 승인이 그 값들을 검증했다는 뜻이 아니다.
