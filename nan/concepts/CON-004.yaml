id: CON-004
title: 제로섬 — 내가 얻은 칸은 반드시 네가 잃은 칸이다
summary: 처음부터 꽉 찬 판에서 매 턴 무작위 반경을 받아 자리 하나를 고르고, 그 반경 안의 칸을 전부 빼앗는다.
tags: [simple, 2d, web, hotseat, versus, grid, zero-sum, shorts-first]
axes:
  space: grid — 14×10 격자. **처음부터 꽉 차 있다**(70 대 70)
  coreVerb: claim — 자리 하나를 클릭한다. 조작 1종
  systemBehavior: transfer — 반경 안의 칸이 소유권을 바꾼다. 칸 총합은 절대 변하지 않는다
  pressure: 고정 턴 수 + 뭉쳐 먹으면 그 자리가 그대로 과녁이 된다
  themeCoupling: >-
    제로섬을 빼면 빈 칸이 생기고 총합이 변해 "뺏는다"가 "채운다"가 된다.
    총합 불변이 없으면 막대 하나로 판세를 보여줄 수도 없고, 내 손해가 네 이득이라는
    비난 구조도 사라진다 — 규칙과 화면과 감정이 전부 이 하나에 걸려 있다
  visualReward: swing — 한 수에 판이 확 바뀌고 가운데 경계가 밀린다
representativeScene: >-
  P2 가 반경 3 을 받아 P1 이 크게 뭉쳐둔 자리 한복판을 찍는다. 25칸이 한 번에 넘어가고
  가운데 막대 경계가 왼쪽으로 크게 밀린다. P1 이 "야 거기 내 거였는데" 하고,
  화면에는 내가 잃은 만큼 정확히 상대가 얻었다는 것이 막대 하나로 보인다.
newCoreSystems: [zerosum]
