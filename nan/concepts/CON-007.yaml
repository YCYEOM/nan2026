id: CON-007
parent: CON-006
title: 총알피하기 3D — 막으면 땅이 돌아온다
summary: >-
  CON-006 의 색 요격 규칙을 그대로 두고 **판을 3D 로 옮긴다.** 원형 아레나가 우주 궤도의
  조각난 발판이 되고, 좁아짐이 "원이 작아진다"가 아니라 **바깥 조각이 떨어져 나간다**가 된다.
  여기에 규칙 하나를 더한다 — **요격을 세 번 하면 마지막으로 막은 자리의 조각이 다시 솟는다.**
  지금까지 요격의 보상은 "상대가 안 죽는다"는 손실 회피뿐이었는데, 조각이 돌아오면
  협동이 **공간이라는 자원**으로 계량된다. 사람은 우주복 작업자다.
tags: [3d, web, hotseat, coop, realtime, bullet, color, plates, shorts-first]
