notes: |
  ## 무엇이 CON-006 에서 바뀌고 무엇이 안 바뀌는가

  **안 바뀐다** — 색 3종 판정, 색 탄은 반대 색을 조준한다는 불변식, 주인 없는 탄의 중점 조준,
  예고선, 생명 3, 이동 1종, P1 WASD · P2 방향키, 결산의 `막은 N · 못 막고 샌 N`.
  **`systems/dodge.ts` 의 색 판정 로직은 한 줄도 안 바뀐다.**

  **바뀐다** — 아레나가 원 하나에서 **조각 배열**이 된다. 축소가 시간 감쇠에서 **조각 붕괴**가
  된다. 여기에 **복구**가 새 규칙으로 들어온다. 그리고 화면이 2D 탑다운에서 **기울인 3D**가 된다.

  ## 사용자가 정한 것

  1. **3D 로 만든다.** 카메라 3안(기울인 아레나 / 고도 있는 탄 / 어깨 뒤 3인칭) 중
     **기울인 아레나**를 전제로 세계관을 골랐다.
  2. **세계는 부서지는 발판.** 압착 사격장·홀로 테이블·종이 디오라마 중에서 골랐다.
  3. **막아주면 바닥이 다시 생긴다.** 사용자 제안이고 이 컨셉의 신규 규칙 전부다.
  4. **사람은 우주복 작업자.** 원통이 몰입을 깬다는 지적에서 나왔다.

  ## 복구가 푸는 것 — 요격에 처음으로 양의 보상이 생긴다

  CON-006 에서 요격의 보상은 **"상대가 안 죽는다"** 하나였다. 손실 회피다. 잘 막아도
  판은 똑같이 좁아지고 화면에 남는 것이 없었다. 복구가 붙으면 막은 만큼 **공간이 돌아온다** —
  협동의 결과가 계량되고, 그 계량치가 다음 30초의 난이도를 정한다.

  **어느 조각이 돌아오는지가 이 규칙의 전부다.** 무작위로 돌려주면 인과가 화면에 안 잡히고
  그냥 "가끔 판이 넓어진다"가 된다. **마지막으로 막은 자리**의 조각이 솟아야
  몸을 던진 그 자리에서 땅이 올라오는 한 프레임이 나온다.

  ## 게임이 안 끝나게 되지 않는가 — 구조적으로 안 그렇다

  복구가 붕괴를 이기면 판이 안 끝나고 후반 압박이 사라진다. 산술로 확인한다.

  | | 값 |
  |---|---|
  | 붕괴 | 2.0초에 1단계 (후반 0.8초) |
  | 본전에 필요한 요격 | **초당 0.5회 → 후반 1.25회** |
  | 실제 요격 기회 | 발사 간격 1.15초, 그중 색 탄이 약 75%, 그중 내 색이 절반 |

  요격 기회 자체가 초당 0.33회를 못 넘고 그중 전부를 막을 수도 없다.
  **복구는 지연이지 역전이 아니다.** 다만 이 산술은 CON-006 의 발사 곡선을 그대로
  가정한 것이고, 실제 판당 요격 횟수는 시뮬레이션으로 재야 한다 — **`RESTORE_BLOCKS`
  를 손으로 고르지 않고 측정에서 유도하는 것**이 이 조각의 첫 작업이다.

  불변식으로 못 박는다: **판당 복구 단계 수 < 판당 붕괴 단계 수.**
  값이 아니라 관계다(PSH-006 에서 배운 패턴).

  ## 예상 못 했던 소득 — 상황 변주가 생긴다

  CON-006 은 쇼츠각 2번(매판 다른 클립)에 함정을 스스로 적어뒀다 —
  **"변주가 결과에만 있고 상황에는 없다"**(떠넘기기에서 배운 것). 총알 색과 조준 대상만
  바뀌고 판은 늘 같은 원이었다.

  조각 판은 그것을 푼다. **판 모양이 그 판의 기록이다.** 못 막은 판은 고르게 무너져 작고 둥글고,
  한쪽만 지킨 판은 초승달이 되고, 나눠 지킨 판은 넓지만 톱니다. 그리고 그 모양이
  다음 30초의 판을 다르게 만든다 — 튀어나온 조각은 도망칠 자리, 파인 곳은 몰리면 죽는 자리다.
  **상황 변주가 플레이 결과에서 나온다.**

  ## 캐릭터 — 우주복 작업자

  원통이 몰입을 깬 이유는 모양만이 아니다. **세 번 맞을 때까지 몸이 안 변했다** —
  생명이 머리 위 점 3개에 적혀 있고 시선은 총알에 가 있으니 아무도 안 본다.
  캐릭터의 값은 귀여움이 아니라 **상태를 몸으로 읽게 만드는 것**이다.

  - **헬멧 형태로 P1·P2 를 가른다** — 둥근 / 각진. 총알의 원·네모와 같은 축이라
    "저 탄은 내 것"이 색 없이도 읽힌다(DESIGN.md 원칙 2).
  - **목숨이 실루엣이다** — 3 온전 / 2 그을음·바이저 금·어깨 램프 하나 꺼짐 /
    1 붉은 점멸·헬멧에서 공기 샘·절뚝. 상대가 급한 것이 보여야 "막으러 갈지"가 판단이 된다.
  - **몸통 폭 = 판정 지름**(`K.BODY` 11 × 2). 실루엣이 판정보다 크면
    "안 맞았는데 맞았다"가 되고 요격도 같은 방식으로 거짓말이 된다.

  ## 흰 우주복은 못 쓴다 — 밝기가 곧 판정 관여도

  가장 사람다운 선택은 흰 우주복이지만 어두운 우주 배경에서 **흰 덩어리가 총알과 밝기로
  경쟁한다.** 이 게임은 색이 곧 판정이라 그 경쟁에서 지는 쪽이 규칙이다.

  해법은 우주복을 무채색이 아니라 **그 사람 색의 어둡고 탁한 버전**으로 두는 것이다.
  같은 색상, 다른 밝기 — 소속은 즉시 읽히고 총알과는 안 싸운다. 화면 전체가 4층이 된다.

  | 층 | 무엇 | 성질 |
  |---|---|---|
  | 1 | 총알 · 예고선 | 발광 · 채도 최대. **화면에서 가장 밝아야 할 유일한 것** |
  | 2 | 바이저 · 어깨 띠 · 백팩 램프 | 좁게 발광. 누구인지만 말한다 |
  | 3 | 우주복 본체 | 같은 색상의 어두운 버전. 비발광. 실루엣만 한다 |
  | 4 | 발판 · 관절 · 부츠 | 배경 톤. **사람 몸에 흰색은 없다** |

  이 규칙은 이 게임 밖에도 쓰인다 — DESIGN.md 에 원칙으로 올릴 후보다.

  ## 메뉴 천장 — 2D 와 3D 를 같이 둘 수 없다

  TASK-008 이 메뉴 7항목 천장을 테스트로 못 박았고(`fits(8) === false`), 총알피하기가
  7번째다. **3D 를 별도 항목으로 추가하면 그 테스트가 깨진다.**
  그러므로 이것은 병행이 아니라 **교체**다 — 기존 2D 씬을 3D 씬으로 갈아끼운다.
  2D 씬 파일은 지우지 않고 남겨 되돌릴 수 있게 한다(메뉴에서만 뺀다).

  ## 이 컨셉이 CON-006 보다 비싼 지점

  CON-006 의 3D 후보 넷 중 셋(압착 사격장·홀로 테이블·종이 디오라마)은 렌더만 바꾸면 됐다.
  **부서지는 발판만 엔진을 연다.** 조각 경계가 새 판정이기 때문이다.

  - `radius` 하나가 **조각 배열**이 된다
  - `confine` 이 **그 사람 각도의 조각 반지름**을 조회한다
  - `collide` 의 요격 분기가 **게이지를 올리고 각도를 기억한다**

  그리고 **딜레마 표(60/130/220px)를 재측정해야 한다.** 판이 원이 아니게 되면
  "붙어 있기 대 떨어져 있기"의 값이 그대로일 이유가 없다.
  이 표는 CON-006 의 회귀 테스트이므로 **깨지면 밸런스가 바뀐 것**이고, 새 값으로 다시 박아야 한다.

  ## 쇼츠각 4항목

  1. **punchline 프레임 ↑** — 탄이 팟 하고 지워지면서 **발밑에 땅이 솟는다.**
     한 프레임에 원인과 보상이 같이 있다.
  2. **매판 다른 클립 ↑** — CON-006 의 약점이 여기서 풀린다. **판 모양이 매판 다르고
     그 모양이 다음 상황을 바꾼다.**
  3. **범인 로테이션 =** — 색이 그대로 범인을 찍는다. 복구는 공동 게이지라 공은 나눠 갖는다.
  4. **숫자 아닌 페이오프 ↑** — 터지는 그림 + **거의 다 무너진 판에서 땅을 되찾는 역전 시퀀스.**

  ## 점수

  합계 90. 이 저장소 최고치다(CON-004 89, CON-006 88).

  - **playability 25** — CON-006 의 24 에 판 지형 판단이 얹힌다. 조작은 안 늘었다.
  - **theme 24** — CON-006(23)보다 높다. 발판 붕괴·복구가 요격 규칙에 물려 있어
    무대 장치가 아니라 성적표다. 색 규칙이 관습이라는 CON-006 의 감점 이유는 그대로 남는다.
  - **novelty 14** — 이 저장소 최고. "색으로 갈리는 2인 상호 요격"에 "요격이 지형을
    되돌린다"가 붙었다.
  - **feasibility 14** — 이 저장소 최저. 3D 렌더 · 조각 판정 · 게이지 · 캐릭터가 한 번에 든다.
    CON-006(17)보다 확실히 비싸다. **엔진과 렌더를 두 작업으로 가른다.**
  - **visualClarity 13** — 3D 가 깊이 오판을 만들지만 밝기 4층 규칙과 바닥 예고선·그림자가
    그것을 갚는다. CON-006(12)보다 조금 높다.

  ## 미해결 — 사람이 봐야 답이 나오는 것

  - **판당 요격 횟수.** `RESTORE_BLOCKS` 3 은 시작값일 뿐이다. 측정에서 유도해야 한다.
  - **딜레마 표가 어떻게 바뀌는가.** 조각 판에서 붙어 있기·떨어져 있기의 값은 미지다.
  - **54px 에서 둥근·각진 헬멧이 갈리는가.** 안 갈리면 바이저 형태로 한 겹 더 나눠야 한다
    (가로 띠 대 세로 띠).
  - **3D 에서 거리 오판이 실제로 나는가.** 바닥 예고선과 발밑 그림자로 갚는다고 설계했지만
    움직이는 물체 여럿이 겹치면 어떨지는 모른다. 이 저장소는 정적 화면에서만 겹침을 여섯 번 냈고
    **움직이는 물체는 배치 검사가 못 본다.**
  - **판이 넓게 오래 유지되면 게임이 길어지는가.** 붕괴 2.0초/단계면 복구 없이도
    전부 무너지는 데 84초로, 기존 축소(33초)보다 느리다.
  - 조각 수 14, 단계 4, 붕괴 주기, 게이지 3 — 전부 근거 없이 고른 값이다.

  승인 (2026-08-06, yeomyooncheol): 컨셉 이미지 4회 검토를 거쳐 승인했다.
  카메라 3안 → 세계관 4안 → 복구 규칙 → 캐릭터 4안 순으로 좁혔고,
  **사용자가 본 것은 각 단계의 렌더와 그 옆에 적힌 대가**다.

  **승인이 수치를 검증했다는 뜻이 아니다** — 조각 수, 단계 수, 붕괴 주기, 게이지 임계,
  카메라 각도, 우주복 색값은 전부 작업 명세에서 정하고 플레이테스트에서 조정한다.
