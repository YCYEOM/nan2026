  판이 거의 다 무너져 초승달만 남았다. 사이언 탄 두 발이 앰버(P2)를 향해 바닥에 예고선을 긋고,
  P1 이 파인 자리를 돌아 달려가 한 발 앞을 막는다. 게이지 셋째 칸이 차고 **P2 발밑에서
