id: CON-006
title: 총알피하기 — 네 색은 내가 막는다
summary: >-
  원형 아레나 한가운데서 시작한다. 판 밖 360도에서 미사일이 쏟아지는데 **총알마다 색이 있다.**
  내 색 총알은 나를 못 죽이고 내가 닿으면 사라진다. 남의 색 총알은 나를 죽인다.
  그래서 **내 색 총알이 상대에게 갈 때 내가 몸으로 가로막아야 한다** — 피하는 게임인데
  다가가는 게임이다.
tags: [simple, 2d, web, hotseat, coop, realtime, bullet, color, shorts-first]
axes:
  space: 원형 아레나(중앙 320·240). 360도 어디서나 들어오고 **시간이 갈수록 좁아진다**
  coreVerb: move — 이동뿐이다. 조작 1종. 제로섬(클릭 1종) 다음으로 적다
  systemBehavior: >-
    intercept — 총알은 **자기 색 플레이어에게 닿으면 소멸**하고 다른 색에게 닿으면 죽인다.
    그래서 회피와 요격이 같은 동사(이동) 안에서 갈린다
  pressure: 시간이 갈수록 발사가 빨라지고 동시 발수가 늘고 아레나가 좁아진다
  themeCoupling: >-
    **요격은 날아오는 발사체에만 성립한다.** 떨어지는 돌·운석은 착탄점에서 끝나므로
    궤적 위에 끼어들 자리가 없고, 그러면 "네 것을 내가 막는다"가 통째로 사라진다.
    피아식별색은 총탄의 관습이라 설명 비용이 0이다
  visualReward: >-
    상대에게 꽂히기 직전의 총알 앞으로 몸을 던져 **총알이 팟 하고 사라지는** 한 프레임.
    또는 못 막아서 상대가 터지는 한 프레임 — 둘 다 색 하나로 인과가 읽힌다
representativeScene: >-
  사이언 탄 두 발이 앰버(P2)를 향해 예고선을 긋는다. P2 는 못 막는 색이라 도망만 칠 수 있고,
  P1 이 반대편에서 달려와 한 발 앞을 막아 팟 하고 지운다. 두 번째는 못 닿는다.
  그 순간 **주인 없는 붉은 탄**이 P1 자리로 들어와 P1 도 피해야 한다.
  P2 가 터지고 P1 이 "미안 하나는 못 갔어" 하고 P2 가 "그거 네 색이었잖아" 한다.
  화면에는 `사이언 탄 — P1 이 못 막았다` 가 적힌다.
