notes: |
  사용자가 주제 "총알피하기"와 형태(중앙 시작 · 360도 랜덤 · 오래 피하기)를 지정했고,
  이어서 **색 규칙**을 직접 제안했다 — "공격은 사용자수만큼의 색을 가지고, 자신과 다른
  색을 맞으면 죽고, 같은 색을 맞으면 그 공격은 없어진다. 다른 사람이 죽을 변수를 서로
  보완해주는 것. 누구도 막을 수 없어서 맞는 색도 있으면 좋겠고, 후반으로 갈수록 공격이
  빨라지거나 맵이 좁아지는 것도 괜찮겠다."

  이 문서는 그 규칙을 그대로 받아 구조를 채운 것이다. **사용자 제안에서 뺀 것은 없다.**

  ## 원안이 하드게이트에 걸렸던 지점과, 색이 그것을 어떻게 푸는가

  최초 원안(1인 · 오래 버티기)은 게이트 4(주제를 빼면 규칙이 달라지는가)에 걸렸다 —
  총알을 돌로 바꿔도 규칙이 안 바뀌고, 1인이라 범인 다툼이 없고, 생존 시간이 숫자
  페이오프였다. 검토 중 엄폐(첫 몸에서 정지) 안을 거쳐 **색 요격**으로 왔다.

  색이 엄폐보다 나은 점이 셋이다.

  - **협동이 규칙에서 나온다.** 엄폐는 상대를 방패로 쓰는 배신이었다. 색은 반대로
    **내가 상대를 살리러 간다** — 사용자 표현대로 "죽을 변수를 서로 보완"한다.
  - **피하기 게임에 다가가기를 심는다.** 회피와 요격이 같은 조작(이동) 안에서 갈리므로
    조작을 안 늘리고 동사를 하나 더 얻는다. 매 순간 "도망갈까 막으러 갈까"가 선다.
  - **범인이 색으로 찍힌다.** "그거 네 색이었잖아"는 변명이 안 되는 종류의 지적이다.
    화면이 판정할 필요도 없이 총알 색이 이미 말하고 있다.

  ## 판정 — 색 하나로 전부 갈린다

  | 총알 | 그 색 주인에게 | 다른 사람에게 |
  |---|---|---|
  | 사이언 탄 (P1 색) | 닿으면 **소멸**. 무사하다 | **죽는다** |
  | 앰버 탄 (P2 색) | 닿으면 **소멸**. 무사하다 | **죽는다** |
  | 붉은 탄 (주인 없음) | — | **누구든 죽는다. 못 막는다** |

  **색 탄은 항상 반대 색 플레이어를 조준한다.** 내 색 탄이 나를 노리면 그냥 흡수하면
  그만이라 규칙이 죽는다. 상대를 노려야 내가 달려갈 이유가 생긴다.

  **주인 없는 탄은 무작위로 조준한다.** 이게 요격 대형을 깨는 장치다 — 둘이 서로를
  지키려고 붙어 있는데 아무도 못 막는 탄이 그 사이로 들어오면 **강제로 흩어져야 한다.**
  사용자가 요청한 "누구도 막을 수 없는 색"이 리듬을 만드는 자리가 여기다.

  ## 매 순간 세 갈래 판단

  화면에 세 색이 동시에 날아온다. 이동 하나로 셋을 처리해야 한다.

  - **내 색** → 상대에게 간다. 달려가서 막는다 (내 몸은 안전하다)
  - **상대 색** → 나에게 온다. 피한다 (상대가 막아주기를 기대할 수도 있다)
  - **주인 없는 탄** → 둘 다 피한다. 아무도 못 막는다

  셋의 방향이 다르면 몸이 하나뿐이라는 것이 곧 압박이 된다. 규칙을 더 넣지 않아도
  긴장이 나온다.

  ## 딜레마도 설계하지 않아도 생긴다

  | 무엇을 하나 | 이득 | 대가 |
  |---|---|---|
  | 상대 색 탄을 막으러 간다 | 상대가 산다 | 그동안 내 회피 자리가 나빠진다 |
  | 안 가고 내 자리를 지킨다 | 내가 안전하다 | 상대가 맞는다 — **네 색이었다** |
  | 둘이 붙어 있는다 | 서로 빨리 막아준다 | 주인 없는 탄 한 발에 **둘 다** 걸린다 |
  | 둘이 떨어져 있는다 | 주인 없는 탄에 같이 안 걸린다 | 막으러 가는 거리가 멀어진다 |

  마지막 두 줄이 중요하다. 엄폐안의 최대 위험이었던 **"둘이 멀어지기만 하는 지배 전략"이
  여기서는 규칙으로 막힌다** — 멀어지면 요격을 못 하고, 요격을 못 하면 상대가 죽는다.
  협동이라 상대의 죽음이 곧 내 손해다.

  ## 사용자가 요청한 후반 압박 — 셋 다 넣는다

  - **발사가 빨라진다** (예고 시간 감소)
  - **동시 발수가 는다** — 원안의 "쏟아진다"가 그대로 곡선이 된다
  - **아레나가 좁아진다** — 강제로 가까워져 주인 없는 탄의 위험이 커진다

  앞선 검토에서 아레나 축소는 YAGNI 로 뺐었지만, 사용자가 명시 요청했고 여기서는
  **역할이 분명하다** — 붙어 있기의 대가를 시간이 갈수록 키운다.

  ## 예고선

  발사 전 `TELEGRAPH` 초 동안 조준선이 **총알 색으로** 그려진다. 없으면 반사신경
  게임이 되고, 있으면 관객이 결과를 0.5초 전부터 안다(쇼츠 1번 항목). 무엇보다
  **요격은 예고 없이는 불가능하다** — 어디로 갈지 미리 알아야 몸을 던진다.

  ## 쇼츠각 4항목 점검

  1. **punchline 프레임** — 상대에게 꽂히기 직전 몸을 던져 총알이 팟 하고 사라지는 한 장.
     색이 인과를 다 말해서 자막이 필요 없다.
  2. **매판 다른 클립** — 색 배분·조준 대상·둘의 위치가 매번 다르다. 다만 **떠넘기기에서
     배운 함정**(변주가 결과에만 있고 상황에는 없음)은 여기서도 봐야 한다 — 주인 없는
     탄과 아레나 축소가 상황 변주 역할을 하지만 그것으로 충분한지는 모른다.
  3. **범인 로테이션** — 색이 매 발 바뀌고 화면이 이름으로 적는다.
  4. **페이오프가 숫자가 아니다** — 팟 하고 지워지는 그림, 또는 터지는 그림이다.

  ## 색과 DESIGN.md

  총알 색이 곧 **주인**이므로 원칙 1(플레이어 색은 그 사람을 가리킬 때만)에 정확히 맞는다.
  이 저장소에서 플레이어 색이 규칙 자체가 되는 첫 사례다.

  원칙 2(상태를 색 하나로만 구분하지 않는다)를 지키려면 **모양도 달라야 한다** —
  색맹과 시연 화면 모두에서 읽혀야 한다. 사이언 탄·앰버 탄·주인 없는 탄을 서로 다른
  형태로 그린다. 구체적 형태는 작업 명세에서 정한다.

  ## 미해결 — 사람이 플레이해야 답이 나오는 것

  - **요격이 실제로 가능한 조작인가.** 예고선을 보고 총알 앞으로 몸을 옮기는 데 걸리는
    시간이 `TELEGRAPH` 보다 길면 요격이 아예 성립하지 않고, 너무 짧으면 전부 막아서
    긴장이 없다. **이 조각의 최대 미지수다.**
  - **주인 없는 탄의 비율.** 너무 많으면 협동이 무의미해지고(어차피 못 막는다), 너무
    적으면 둘이 붙어 있는 것이 무료 정답이 된다.
  - **몸이 하나뿐인 것이 답답한가 즐거운가.** 세 색이 동시에 오면 어차피 못 막는 상황이
    잦을 텐데, 그것이 "아깝다"로 느껴지면 좋고 "불가능하다"로 느껴지면 실패다.
  - **동시 실시간 2인 핫시트가 한 키보드에서 되는가.** 리듬 팀전이 동시 입력을 쓰지만
    거기는 정해진 키를 두드리는 것이고 여기는 둘 다 계속 움직인다.
  - **판독성.** 세 색의 예고선과 총알이 동시에 여럿 날아다닌다. 이 저장소는 정적 화면에서도
    겹침을 네 번 냈고(TASK-010~013), 코너킥에서 움직이는 물체 아홉을 아직 못 봤다.
  - 수치 전부 — 아레나 반지름과 축소 곡선, 예고 시간, 총알 속도·굵기, 발사 간격,
    동시 발수 곡선, 주인 없는 탄 비율, 생명 수, 이동 속도.
  - **novelty 12 는 이 저장소에서 두 번째로 높다**(CON-002 의 13 다음). 탄막 회피는
    흔하지만 "색으로 갈리는 2인 상호 요격"은 드물다.

  ## 세로 조각의 경계 — 6시간 안에 드는 것과 안 드는 것

  **넣는다** — 원형 아레나 · 2인 동시 이동 · 360도 조준 발사 · 색 3종(P1·P2·주인 없음) ·
  색별 예고선 · 요격 소멸 판정 · 생명 3개 · 발사 가속 · 동시 발수 상승 · 아레나 축소 ·
  피격 시 범인 표기 · 결산(각자 막은 수 / 못 막은 수).

  **뺀다** — 탄종 변화(곡선탄·유도탄·분열탄), 대시·무적, 엄폐물, 3인 이상(색 규칙은
  N인으로 자연히 확장되지만 조각에서는 2인으로 고정한다), 부활.

  ## 점수

  합계 88. CON-004(89) 바로 아래, CON-003·CON-001(88)과 같고 CON-005(78)보다 한참 위다.

  - **playability 24 는 이 저장소 최고치다.** 매 순간 세 갈래 판단이 이동 하나로 처리된다.
  - theme 23 — 요격은 발사체의 성질이라 결합이 있지만, **색 규칙 자체는 물리가 아니라
    관습이다.** 엄폐안(26)이 이 축에서는 더 순수했다. 정직하게 낮춘다.
  - feasibility 17 — 색·요격·주인 없는 탄·가속·축소가 한 번에 들어간다. 엄폐안(18)보다
    약간 크지만 여전히 AI 가 없고 물리가 직선뿐이라 코너킥(15)보다 낫다.
  - visualClarity 12 — 세 색이 동시에 날아다닌다. 이 조각의 두 번째 위험이다.

  **메뉴 자리 문제.** 이 게임이 7번째다. TASK-008 의 유도식이 1~7항목까지 안전하므로
  **이것이 마지막 자리**이고, 8번째부터는 스크롤이 필요하다(TASK-008 기록의 열린 항목).

  작업 ID 계열은 `DGE-###`. `TASK-`(하네스·리듬)·`MIM-`(모방)·`PSH-`(떠넘기기)·
  `ZRO-`(제로섬)·`COR-`(코너킥)과 가른다.

  승인 (2026-07-31, yeomyooncheol): 색 요격 구조를 승인했다. 최초 원안(1인 생존)에서
  엄폐(첫 몸 정지)를 거쳐 색 규칙으로 두 번 방향을 바꿨고, 색 규칙은 **사용자가 직접
  제안한 것**이다.

  **승인 시점에 사용자가 본 것은 평문 요약이다** — 색 3종 판정표, 색 탄이 반대 색을
  조준한다는 것, 주인 없는 탄이 요격 대형을 깬다는 것, 후반 압박 3종, 점수 88 과
  각 축의 근거, 그리고 최대 미지수(요격이 `TELEGRAPH` 안에 가능한 조작인가).

  수치는 **아무것도 확정되지 않았다** — 아레나 반지름과 축소 곡선, 예고 시간, 총알
  속도·굵기, 발사 간격, 동시 발수 곡선, 주인 없는 탄 비율, 생명 수, 이동 속도.
  주인 없는 탄 비율과 생명 3개를 지금 정할지 물었고 사용자가 따로 지정하지 않았으므로
  **작업 명세에서 내가 정하고 플레이테스트에서 조정한다.**
  승인이 그 값들을 검증했다는 뜻이 아니다.
