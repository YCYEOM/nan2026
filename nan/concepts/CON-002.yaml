id: CON-002
title: 사라지는 선 — 망가지는 채널로 원본을 전달한다
summary: P1 이 원본을 보고 그리지만 그 선은 곧 사라지고, P2 는 사라지는 선만 보고 원본을 다시 만든다.
tags: [simple, 2d, web, online-coop, mouse, shorts-first]
axes:
  space: canvas — 각자 자기 2D 캔버스. P1 은 원본+자기 선, P2 는 열화된 중계+자기 선
  coreVerb: draw — 마우스 드래그로 선 긋기 (보조 1종은 제출/지우기)
  systemBehavior: decay — 그려진 선이 수명(TTL)을 다하면 사라진다. 채널이 계속 정보를 잃는다
  pressure: time (제한 시간) + information decay (전달할 수 있는 양이 계속 줄어든다)
  themeCoupling: >-
    채널 열화를 빼면 P2 가 P1 의 선을 그대로 베끼면 되고, 캔버스가 둘일 이유도 사라진다.
    "모방"을 빼면 원본·중계·결과 세 층 구조 자체가 남지 않는다 — 규칙이 소멸한다
  visualReward: reveal — 제출 순간 원본·P1·P2 세 장이 나란히 열리고 유사도 %가 뜬다
representativeScene: >-
  제한 시간이 끝나고 세 장이 동시에 열린다. 원본은 별 모양, P1 의 그림은 알아볼 만하고,
  P2 의 그림은 전혀 다른 것이 되어 있다. 유사도 31%. 둘 중 누가 망쳤는지가 한눈에 갈리고
  서로 상대를 지목한다.
newCoreSystems: [stroke-canvas, shape-similarity]
hardGates:
  theme-is-mechanic: true
  one-sentence-playable-loop: true
  representative-scene: true
  vertical-slice-in-six-hours: true
  maximum-two-new-core-systems: true
  visible-player-feedback: true
  shippable-evidence: true
score:
  theme: 27
  playability: 17
  novelty: 13
  feasibility: 15
  visualClarity: 15
approvedBy: yeomyooncheol
notes: |
  본선 주제 공개 전 후보다. 사용자가 4개 후보(모방·통역·폭탄 돌리기·유령) 중
  "모방"을 골랐고, 선정 기준은 재미가 아니라 **쇼츠를 대량으로 만들 수 있는가** 였다.

  왜 이 주제인가 (사용자가 명시한 목적: 같이 플레이하며 쇼츠 대량 생산):
  - 게임이 **비교 가능한 산출물을 스스로 뱉는다.** 원본/P1/P2 세 장이 곧 클립이다.
    순간을 포착하는 게 아니라 매 판 생성되므로 "대량"이 구조적으로 성립한다.
  - **2초에 읽힌다.** 좌우(삼단) 비교 이미지는 자막도 소리도 필요 없다.
  - **범인이 갈린다.** 전달이 망했나 그림이 망했나가 중간 층(P1 그림)으로 특정된다.
    이 저장소의 최대 교훈 — "정확도 87.3%는 아무도 못 읽지만 '네가 망쳤다'는 읽힌다".
  - 각자 마우스·각자 화면이 전제인데 리듬 게임에서 미룬 **정보 비대칭**이 여기선 규칙 자체다.

  하드게이트 근거:
  - theme-is-mechanic: 채널 열화(decay)가 규칙의 원천이다. 열화를 끄면 베끼기가 되어
    게임이 사라진다. themeCoupling 참조.
  - one-sentence-playable-loop: summary 한 문장이 그대로 플레이 루프.
  - representative-scene: 세 장 공개 + 유사도. 5초 안에 설명 없이 읽힌다.
  - vertical-slice-in-six-hours: 위험 항목이다. 아래 "미해결" 참조.
  - maximum-two-new-core-systems: 신규 2개(stroke-canvas, shape-similarity).
    채널 열화는 stroke-canvas 안의 TTL 파라미터라 3번째 시스템이 아니다.
    Harness·Sfx·kits/dragdrop 는 재사용.
  - visible-player-feedback: 그리는 즉시 선이 보이고, 수명이 줄며 흐려지고, 사라진다.
    제출 시 삼단 비교 + 유사도 %.
  - shippable-evidence: 타깃을 절차 생성하고 에셋이 0이다(도형 렌더 + Web Audio 신스).
    원문 게이트7 "대량의 수작업 콘텐츠" 위험 없음.

  미해결 — 사람 판단이 필요한 것:
  - **유사도를 무엇으로 재는가.** 후보는 두 캔버스를 저해상 격자로 래스터화해 IoU 를
    내는 것이다(격자 32×24 면 40줄 안팎). 스트로크 순서·굵기를 무시하므로 "닮았다"의
    사람 감각과 어긋날 수 있다. 이 판정이 납득되지 않으면 게임 전체가 무너진다.
    → 6시간 위험의 대부분이 여기다.
  - **열화 방식.** TTL(그린 선이 사라짐)을 1안으로 뒀다. 대안: 지연 중계, 좌표 격자
    스냅, P1 이 버튼 누른 동안만 중계. TTL 이 가장 싸고 판독이 쉽지만 "기억력 게임"으로
    기울 여지가 있다 — 어느 쪽이 재미있는지는 만들어 봐야 안다.
  - **네트워크가 전제인가.** 정보 비대칭이 규칙이라 한 화면 핫시트로는 성립하지 않는다
    (P2 가 원본을 보게 된다). 리듬 게임에서 미룬 시점 분리가 여기서는 선행 조건이다.
    → 6시간 세로 조각을 로컬 2창(같은 브라우저 두 캔버스)으로 낼지, 네트워크까지 갈지
    결정해야 한다. 로컬 2창이면 게이트를 지키지만 실제 플레이 감각은 검증되지 않는다.
  - **음성.** 클립의 오디오 트랙은 두 사람이 지르는 소리인데 게임은 음성을 구현하지 않는다
    (외부 통화 전제). 그 가정을 명시해 둔다.

  점수는 CON-001 과 같은 자체 평가 기준(합 100 배점)이다. 합 87.
  feasibility 를 CON-001(18)보다 낮게 준 이유는 유사도 판정과 시점 분리가 둘 다
  미검증이기 때문이다 — CON-001 은 이미 구현된 것을 사후 기록한 컨셉이었다.

  승인 (2026-07-30, yeomyooncheol): 주제와 루프를 승인했다. 미해결 4건 중 열화 방식(TTL)과
  세로 조각 범위(로컬 2창)는 본문의 1안을 그대로 채택한 것으로 본다 — 승인이 그 두 값을
  검증했다는 뜻은 아니다. 유사도 판정과 네트워크 전환은 여전히 열려 있다.

  작업 ID 는 `MIM-###` 계열을 쓴다. `TASK-###`(001~007)은 하네스·리허설4 리듬 릴레이
  계열이고 이 게임은 별개다. 두 계열이 한 저장소에서 병행하므로 접두사로 가른다.

  상세 명세는 `tasks/MIM-001.md` 와 docs/GAME_SPEC.md 신설 절.

  대체됨 (2026-07-30): CON-003 "떠넘기기" 가 이 컨셉을 대체한다. 사용자가 세로 조각을
  플레이하고 재미없다고 판정했다. 폐기하지 않고 남기는 이유는 판단 기록이기 때문이다 —
  실패 원인(의미 없는 페이로드 + 퍼센트 페이오프)이 CON-003 의 설계 근거가 됐다.

