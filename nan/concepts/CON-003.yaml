id: CON-003
title: 떠넘기기 — 터지기 전에 상대에게 밀어넣는다
summary: 굴리면 게이지와 내 점수가 함께 오르고, 터지기 전에 넘기면 쌓인 게이지가 그대로 상대 차례로 간다.
tags: [simple, 2d, web, hotseat, versus, dice, shorts-first]
axes:
  space: none — 공유 게이지 하나와 주사위. 공간 구조가 없다
  coreVerb: gamble — 굴리기(주사위) / 넘기기(차례 전가). 조작 2종
  systemBehavior: escalate — 굴릴수록 게이지가 오르고 숨은 임계값에 가까워진다
  pressure: hidden threshold (임계값은 범위만 공개) + shared consequence (게이지는 넘겨도 안 줄어든다)
  themeCoupling: >-
    운을 빼면 게이지 증가량과 임계값이 확정되어 최적 정지점이 계산으로 풀린다.
    계산이 끝나면 굴릴지 넘길지 고민할 것이 없어 규칙 자체가 남지 않는다
  visualReward: pop — 게이지가 임계를 넘는 순간 화면이 터지고 그때 굴린 사람이 특정된다
representativeScene: >-
  게이지가 58에서 P1 이 "한 번만 더"를 외치며 굴린다. 6이 나와 64. 임계값은 60~100 사이라고만
  적혀 있었다. 살았다. P1 이 넘긴다. P2 가 강제로 굴려야 하고 3이 나와 67 에서 터진다.
  화면이 붉게 팝하고 P2 의 라운드 점수가 0 이 된다. P2 가 P1 을 지목한다.
newCoreSystems: [pushluck]
hardGates:
  theme-is-mechanic: true
  one-sentence-playable-loop: true
  representative-scene: true
  vertical-slice-in-six-hours: true
  maximum-two-new-core-systems: true
  visible-player-feedback: true
  shippable-evidence: true
score:
  theme: 25
  playability: 19
  novelty: 10
  feasibility: 19
  visualClarity: 15
approvedBy: yeomyooncheol
notes: |
  CON-002(모방 "사라지는 선")를 대체한다. 사용자가 플레이하고 "재미있는지 모르겠어" 후
  "주제를 바꾸는 게 좋겠다, 주사위 같은 랜덤성이 들어간 게임이면 좋겠다"로 방향을 바꿨다.
  후보 3개(떠넘기기·운 강탈·썩는 주사위) 중 떠넘기기를 골랐다.

  랜덤성에 대한 전제 — 이 컨셉의 근거다:
  - **순수한 랜덤은 클립이 안 된다.** 아무도 동전 던지기를 클립으로 만들지 않는다.
    굴리기 **전에** 사람이 뭔가를 걸어야 punchline 이 생긴다(푸시 유어 럭).
  - 랜덤이 주는 것: (1) 반응이 순수해진다 — 비난 게임은 방어적으로 만들지만 주사위는
    하늘에 소리치게 만든다 (2) 맥락 없이 긴장이 읽힌다 — "6이 나와야 한다"는 1초에
    이해된다 (3) 변량이 곧 다양성이다 — 매판 다른 결과 = 매판 다른 클립.
    모방은 다양성을 얻으려 타깃을 생성해야 했는데 랜덤은 공짜로 준다.
  - 가장 귀한 조합은 **랜덤이면서 범인이 사람인 것**이다. 주사위가 책임을 지워주는데
    굴리기로 한 결정과 넘기기로 한 결정은 누군가의 것이다.

  설계에서 먼저 막은 두 붕괴 — 이걸 안 막으면 게임이 성립하지 않는다:
  - **넘기기가 공짜면 최적 전략이 "항상 즉시 넘기기"** 라 게임이 붕괴한다.
    → 내 차례에는 **반드시 한 번 굴려야** 넘길 수 있다. 이 규칙 하나로 넘기기가
      수동적 회피가 아니라 **공격**이 된다(상대에게 더 높은 게이지에서 강제 굴림을 준다).
  - **굴리기가 순수 손해면 아무도 굴리지 않는다.**
    → 굴려서 오른 게이지만큼 **내 라운드 점수도 오른다.** 굴리는 이유가 생긴다.
  두 규칙이 맞물려야 "굴릴까 넘길까"가 실제 결정이 된다. 하나만 빼도 한쪽이 지배전략이 된다.

  얕음 리스크와 대응 — 내가 폭탄 돌리기 후보를 "깊이가 얕다"고 평했던 그 구조다:
  - 대칭 상황에서 "굴릴까 넘길까"는 기대값 하나로 풀려 단조로워진다.
  - → **점수 차이가 정답을 바꾼다.** 쫓기는 쪽은 더 굴려야 하고 앞선 쪽은 확보하려 한다.
    같은 결정이 국면마다 다른 답을 갖게 만드는 것이 깊이의 유일한 출처다.
  - → 임계값을 **범위만 공개**한다(예 "60~100"). 완전 미지는 계산 불가라 긴장이 아니라
    체념이 되고, 완전 공개는 산수가 된다. 범위 공개가 시청자에게도 위험을 읽히게 한다.
  - 이 대응이 충분한지는 만들어 봐야 안다. CON-002 에서 "구조를 검증 없이 정교하게
    만들었다"로 실패했으므로, 세로 조각의 첫 질문은 "재미있는가" 하나여야 한다.

  하드게이트 근거:
  - theme-is-mechanic: 랜덤을 끄면 최적 정지점이 계산으로 풀려 결정이 사라진다. themeCoupling 참조.
  - one-sentence-playable-loop: summary 한 문장이 그대로 플레이 루프.
  - representative-scene: 게이지 팝 + 그때 굴린 사람. 5초 안에 설명 없이 읽힌다.
  - vertical-slice-in-six-hours: 상태가 (게이지·임계값·점수2·생명2·차례)뿐이다. 이 저장소
    역대 가장 안전한 범위다. 물리·드로잉·오디오 타이밍 같은 위험 요소가 없다.
  - maximum-two-new-core-systems: 신규 1개(pushluck). Harness·Sfx·토큰 재사용.
  - visible-player-feedback: 굴린 눈·게이지 막대·임계 범위·점수·생명이 전부 상시 표시.
    터질 때 화면 팝 + 라운드 점수 소멸이 즉시 보인다.
  - shippable-evidence: 에셋 0(도형 + Web Audio 신스), 절차 생성 난수뿐. 수작업 콘텐츠 없음.

  쇼츠각 4항목 점검:
  1. punchline 프레임 — 게이지가 임계를 넘어 팝하는 순간 + 그때 굴린 사람. 막대 하나라 2초 판독.
  2. 매판 다른 클립 — 숨은 임계값 + 주사위로 매판 다른 지점에서 터진다. 게다가 클립이
     **두 종류로 번갈아 난다**: 욕심내서 자기가 터지는 자책("한 번만 더 하다가")과
     넘겨서 상대가 터지는 비난("네가 넘겨서"). 한 종류짜리 구조보다 낫다.
  3. 범인 로테이션 — 굴린 사람 또는 넘긴 사람. 매판 바뀐다.
  4. 페이오프가 숫자가 아니다 — 터졌나 / 살았나. 점수는 부차 신호다.
     (모방은 페이오프를 퍼센트로 만들어 실패했다. 같은 실수를 반복하지 않는다.)

  세로 조각 상의 이점 — 모방의 최대 약점이 여기선 약점이 아니다:
  - 턴제라 **마우스 하나·한 화면으로 2인 플레이가 정상 형태다.** 모방은 순차 진행이
    타협이었고 "동시 플레이 감각"을 검증할 수 없었지만, 여기서는 핫시트가 완성형이다.
    세로 조각에서 진짜 2인 플레이를 검증할 수 있다.
  - 네트워크는 나중에 같은 규칙 그대로 옮기면 된다. 정보 비대칭이 규칙이 아니라서
    시점 분리가 선행 조건이 아니다.

  미해결 — 사람 판단이 필요한 것:
  - **재미의 방향이 보이는가.** 세로 조각의 유일한 질문이다. 안 보이면 노브가 아니라
    구조를 다시 본다.
  - 임계 범위의 폭. 좁으면 산수가 되고 넓으면 체념이 된다.
  - 목표 점수와 생명 수. 판 길이를 정하고 쇼츠 길이를 정한다.
  - 주사위 개수·면 수. 1d6 이 1안이지만 2d6 이면 분포가 모여 계산 가능성이 올라간다.
  - novelty 를 10 으로 낮게 줬다. Pig/Farkle 계열에 떠넘기기를 합친 것이고 새로움이
    이 게임의 강점이 아니다 — 강점은 클립 생산성과 6h 안전성이다.

  CON-002 는 폐기하지 않고 남긴다(판단 기록). 모방 코드의 존치 여부는 사용자 결정 대기.
  작업 ID 계열은 `PSH-###` 를 쓴다 — `TASK-`(하네스·리듬), `MIM-`(모방)과 가른다.

  승인 (2026-07-30, yeomyooncheol): 주제와 루프를 승인했다. 미해결 4건(재미의 방향,
  임계 범위 폭, 목표 점수·판 길이, 주사위 개수)은 세로 조각에서 사람이 플레이해야
  답이 나온다 — 승인이 그 값들을 검증했다는 뜻이 아니다.
  모방 코드(MIM 계열 3파일 + 메뉴 1줄)는 사용자 지시로 **삭제하지 않고 그대로 둔다.**

