decisions:
  - DEC-RELAY               # DECISIONS 07-27 리허설4 채택: 라운드로빈 턴 릴레이
  - DEC-SYNC                # DECISIONS 07-27 동시 비트(합주) + 협동 홀드
  - DEC-MASH-EASE           # DECISIONS 07-27 연타 완화: 5→3~4회, 1→1.6박, 앞뒤 grace
  - DEC-MASH-RESULT         # DECISIONS 07-29 Result 에 mash 추가 — 홀드와 표시 분리
  - DEC-ACCURACY            # DECISIONS 07-29 개인 비교를 점수→적중률, 동시류 귀책 분리
  - DEC-TURN-LEADIN         # DECISIONS 07-29 리드인에도 첫 노트 담당 표시
  - DEC-DESIGN-TOKENS       # DECISIONS 07-29 DESIGN.md + tokens.ts + web 프로파일
  - DEC-MIM-THEME           # DECISIONS 07-30 주제 "모방" 채택 — 선정 기준은 쇼츠 대량 생산
  - DEC-MIM-DECAY-RELAY     # DECISIONS 07-30 열화를 중계에만. P1 자기 캔버스는 영구
  - DEC-MIM-THREE-SCORES    # DECISIONS 07-30 점수 3개(전달·재현·총점) + 낮은 쪽 붉게
  - DEC-MIM-IOU-DILATE      # DECISIONS 07-30 32×24 격자 IoU + 1칸 팽창 (순수 IoU 아님)
  - DEC-MIM-NO-TRACE        # DECISIONS 07-30 원본 덧그리기 금지 — 별도 참조 상자, 4:3 통일
  - DEC-MIM-SLICE-SPLIT     # DECISIONS 07-30 세로 조각은 2분할 순차. 정보 비대칭 미성립을 명시
  - DEC-MIM-CANCEL          # DECISIONS 07-30 모방 취소 — 의미 없는 페이로드 + 퍼센트 페이오프
  - DEC-PSH-THEME           # DECISIONS 07-30 주제 "떠넘기기" 채택 — 순수 랜덤은 클립이 안 된다
  - DEC-PSH-NO-COLLAPSE     # DECISIONS 07-30 붕괴 방어 2종(굴려야 넘긴다 / 게이지만큼 pot)
  - DEC-PSH-NO-LIVES        # DECISIONS 07-30 생명 없음 — 점수 차이가 깊이의 유일한 출처
  - DEC-PSH-POT-ROUND       # DECISIONS 07-30 pot 은 라운드 끝에만 확보
  - DEC-PSH-RANGE-ONLY      # DECISIONS 07-30 임계는 범위만 공개, 확률 미표시
  - DEC-PSH-BLAME-3         # DECISIONS 07-30 범인 3종을 이름으로 적는다
  - DEC-PSH-FUSE            # DECISIONS 07-30 게이지 막대 → 타들어가는 심지, 끊긴 자리에서 폭발
  - DEC-PSH-MODS            # DECISIONS 07-30 라운드 규칙 9종 + 판돈 상승 — 상황에 변주를 넣는다
  - DEC-PSH-UNDO-BOOM       # DECISIONS 07-30 되돌리기는 터진 라운드를 통째로, RNG 는 안 되감는다
  - DEC-ZRO-THEME           # DECISIONS 07-30 주제 "제로섬" 채택 — 범인 특정과 판독성이 규칙에 내장
  - DEC-ZRO-FULL-BOARD      # DECISIONS 07-30 처음부터 꽉 찬 판. 빈 칸을 두지 않는다
  - DEC-ZRO-PER-TURN-SCORE  # DECISIONS 07-30 매 턴 점수 — 마지막 수 특권과 초반 무의미를 함께 막는다
  - DEC-ZRO-DIAMOND         # DECISIONS 07-30 맨해튼 반경, 클릭 전 공개 (ZRO-002 에서 모양 7종으로 대체)
  - DEC-ZRO-SHAPES          # DECISIONS 07-30 반경 1종 → 모양 7종, 전부 점대칭(회전 불필요)
  - DEC-ZRO-SHARED-SHAPE    # DECISIONS 07-30 한 라운드는 양쪽이 같은 모양 — 운의 비대칭이 곧 승패가 되므로
  - DEC-ZRO-WHY-SIZE        # DECISIONS 07-30 깎인 이유를 화면에 적는다 (판 밖 −N · 내 칸 −N)
  - DEC-ZRO-TRAIL           # DECISIONS 07-30 종료 화면 판세 궤적 + 최고의 한 수
  - DEC-ZRO-LAYOUTS         # DECISIONS 07-30 시작 배치 5종 — 정확히 반반 + 뒤집기 대등
  - DEC-ZRO-RNG-WARMUP      # DECISIONS 07-30 시드 LCG 워밍업 16회 (TASK-009 에서 kits/rng 로 대체)
  - DEC-RNG-KIT             # DECISIONS 07-30 시드 난수를 kits/rng 로 뽑고 splitmix32 로 교체
  - DEC-TEXT-BAND           # DECISIONS 07-30 fillText 의 y 는 baseline — 위로 0.8배 뻗는다. kits/layout 신설
  - DEC-COR-THEME           # DECISIONS 07-31 주제 "코너킥" 채택 — 범인 다툼이 주제에 내장돼 있다
  - DEC-COR-POWER-RADIUS    # DECISIONS 07-31 파워 정확도가 낙하 원 반경을 정한다 — 이 게임의 인과 사슬
  - DEC-COR-SLIDING-RING    # DECISIONS 07-31 원의 중심이 조준점에서 낙하점으로 미끄러진다
  - DEC-COR-AI-WATCHES-BALL # DECISIONS 07-31 수비 AI 는 헤더가 아니라 원 중심을 쫓는다
  - DEC-COR-AI-DELAY        # DECISIONS 07-31 수비수·GK 반응 지연 + 수비수는 헤더를 마크하고 선다
  - DEC-COR-COVER-GROWS     # DECISIONS 07-31 GK 커버 폭이 거리에 비례 — 깊게 올리면 안전하지만 골이 안 된다
  - DEC-COR-SIX-BLAMES      # DECISIONS 07-31 실패 6종, 키커 3 · 헤더 3. GK 두 종류를 안 합친다
  - DEC-COR-HEIGHT-CUES     # DECISIONS 07-31 높이 단서 셋 — 그림자 · 잇는 점선 · 커지는 공
  - DEC-COR-RESERVE-SPACE   # DECISIONS 07-31 필드 380→360, 아래 60px 을 먼저 비워둔다
  - DEC-COR-HEADER-EARLY    # DECISIONS 07-31 헤더는 파워 단계부터 움직인다
  - DEC-DGE-THEME           # DECISIONS 07-31 주제 "총알피하기" 채택 — 원안 1인에서 2인 색 요격으로
  - DEC-DGE-COLOR           # DECISIONS 07-31 자기 색은 자기를 못 죽인다 — 회피와 요격이 한 조작 안에서 갈린다
  - DEC-DGE-AIM-OPPOSITE    # DECISIONS 07-31 색 탄은 항상 반대 색을 조준한다
  - DEC-DGE-NEUTRAL-MID     # DECISIONS 07-31 주인 없는 탄은 두 사람의 중점을 노린다
  - DEC-DGE-METRIC-WRONG    # DECISIONS 07-31 요격률 97%는 지표 오류였다 — 죽음의 구성으로 재야 한다
  - DEC-DGE-NO-SPREAD       # DECISIONS 07-31 조준 산포를 넣었다가 지웠다 — 값을 못 했다
  - DEC-DGE-DILEMMA-TEST    # DECISIONS 07-31 딜레마 자체를 회귀 테스트로 못 박는다
  - DEC-DGE-SHAPE-TOO       # DECISIONS 07-31 총알을 색 + 모양으로 구분 — 색이 곧 생사라 색맹 대응이 필수
  - DEC-DGE-SPLIT-KEYS      # DECISIONS 07-31 동시 실시간이라 P1 WASD · P2 방향키로 가른다

requirements:
  - REQ-TURN-VISIBLE        # 다음 비트 담당을 항상 화면에서 알 수 있다 (리드인 포함)
  - REQ-JUDGE-WINDOW        # perfect ±0.09s / good ±0.2s, 남의 차례=wrong, 창 전=early
  - REQ-SHARED-FATE         # 팀전은 콤보·생명·점수를 공유한다 — 한 명의 미스가 전원 손해
  - REQ-NOTE-KIND-CLEAR     # 노트 종류(탭/홀드/동시/협동홀드/연타)가 지시문에서 구분된다
  - REQ-FAIR-COMPARE        # 개인 비교는 차트 운이 아니라 적중률로 한다 (모수 병기)
  - REQ-BLAME-PRECISE       # 팀이 깨지면 귀책자만 개인 지표가 하락한다
  - REQ-MIM-BLAME-LAYER     # 원본↔P1 과 P1↔P2 를 따로 보여 어느 층이 망쳤는지 갈린다
  - REQ-MIM-NO-TRACE        # P1 은 원본을 덧그릴 수 없다 (참조 상자 분리)
  - REQ-MIM-RELAY-ONLY      # P2 는 원본을 볼 수 없고 사라지는 중계만 본다
  - REQ-MIM-NO-ASSETS       # 타깃은 시드로 절차 생성된다 — 수작업 콘텐츠 0
  - REQ-PSH-MUST-ROLL       # 차례에 한 번 굴리기 전에는 넘길 수 없다
  - REQ-PSH-GAUGE-KEEPS     # 넘겨도 게이지가 줄지 않는다 — 넘기기가 공격이다
  - REQ-PSH-RISK-VISIBLE    # 임계 범위가 항상 화면에 보이고 위험 구간이 음영으로 표시된다
  - REQ-PSH-BLAME-NAMED     # 터질 때 범인이 이름으로 표시된다 (숫자가 아니다)
  - REQ-PSH-ROUND-VARIES    # 라운드마다 상황이 달라진다 — 규칙 이름이 화면에 뜬다
  - REQ-PSH-TWO-VERBS       # 규칙이 늘어도 상시 조작은 굴리기/넘기기 2종을 넘지 않는다
  - REQ-ZRO-INVARIANT       # 어느 시점에도 내 칸 + 네 칸 = 판 크기. 빈 칸이 없다
  - REQ-ZRO-RADIUS-FIRST    # 반경은 클릭 전에 보여준다 — 뒤면 결정이 사라진다
  - REQ-ZRO-PREVIEW         # 뺏을 범위를 클릭 전에 미리 보여준다
  - REQ-ZRO-HOLD-PAYS       # 오래 들고 있는 것이 값이 된다 (매 턴 점수)
  - REQ-ZRO-FAIR-SHAPE      # 같은 라운드의 두 사람은 같은 모양을 받는다
  - REQ-ZRO-ONE-VERB        # 조작은 클릭 1종 — 회전이 필요한 모양을 넣지 않는다
  - REQ-ZRO-SIZE-EXPLAINED  # 뺏는 크기가 최대에서 깎인 이유가 화면에 적힌다
  - REQ-ZRO-START-FAIR      # 모든 시작 배치가 정확히 반반이고 양쪽이 대등하다
  - REQ-ZRO-TRAIL-VISIBLE   # 판이 끝나면 어떻게 흘렀는지가 한 장에 남는다
  - REQ-RNG-RANGE           # 시드 난수는 항상 [0,1) — 1.0 이면 배열 범위를 벗어난다
  - REQ-RNG-SEED-SPREAD     # 이웃 시드가 즉시 갈라진다 — 첫 출력 하나로 추첨이 정해지는 곳이 있다
  - REQ-TEXT-NO-OVERLAP     # 화면의 글자가 서로 겹치지 않고 캔버스 안에 들어온다

  - REQ-COR-RING-HONEST     # 낙하점은 언제나 화면의 원 안에 있다 — 원이 거짓말하지 않는다
  - REQ-COR-KICK-DRIVES     # 키커의 파워 정확도가 헤더의 난이도를 정한다
  - REQ-COR-BLAME-NAMED     # 실패는 퍼센트가 아니라 이름으로 뜨고 근거 수치가 붙는다
  - REQ-COR-ZONE-DILEMMA    # 골문 앞·중거리·깊은 곳이 각각 다른 대가를 치른다
  - REQ-COR-AI-BEATABLE     # 수비수·GK 는 벽이 아니다 — 반 발 먼저면 이긴다
  - REQ-COR-HEIGHT-READS    # 공의 높이가 그림으로 읽힌다
  - REQ-COR-ROLE-ROTATES    # 코너마다 역할이 바뀌고 키커별 성적이 모수와 함께 남는다

  - REQ-DGE-COLOR-DECIDES   # 총알 색 하나가 소멸·피격·무피해를 전부 가른다
  - REQ-DGE-INTERCEPT       # 내 색 탄이 상대에게 갈 때 몸으로 막을 수 있다
  - REQ-DGE-TELEGRAPH       # 예고 없이는 요격이 불가능하다 — 조준선이 먼저 보인다
  - REQ-DGE-NO-FREE-SPACING # 붙어 있기도 떨어져 있기도 공짜가 아니다
  - REQ-DGE-BLAME-COLOR     # 못 막은 색 탄은 그 색 주인의 몫으로 남는다
  - REQ-DGE-COLORBLIND      # 색맹과 시연 화면에서도 총알 3종이 구분된다

scenarios:
  - SCN-RELAY-CLEAR         # 두 사람이 번갈아 32비트를 완주해 스테이지 클리어
  - SCN-SYNC-BREAK          # 동시 비트에서 한 명이 창을 놓쳐 팀 미스
  - SCN-COOP-EARLY-RELEASE  # 협동 홀드에서 한 명이 먼저 떼 팀 브레이크
  - SCN-MASH-FILL           # 연타 창 안에서 3~4회를 채워 성공
  - SCN-UNEVEN-CHART        # 변칙 차트가 담당을 불균등 배분한 판에서 승자를 가림
  - SCN-MIM-RELAY-FAIL      # P1 은 잘 그렸는데 중계가 사라져 P2 가 딴 그림을 낸다 (재현이 낮다)
  - SCN-MIM-DRAW-FAIL       # P1 이 원본을 놓쳐 애초에 다른 것을 그린다 (전달이 낮다)
  - SCN-MIM-BURST           # P1 이 선을 몰아 그려 P2 가 후반에 아무것도 못 본다
  - SCN-PSH-GREED-BOOM      # 욕심내서 한 번 더 굴린 사람이 자기 손에 터진다 (self)
  - SCN-PSH-PASS-BOOM       # 넘김을 받아 강제로 굴린 사람이 터진다 (passer)
  - SCN-PSH-COMEBACK        # 쫓기는 쪽이 위험을 안고 굴려 pot 을 키운다
  - SCN-PSH-UNDO-SAVE       # 터진 직후 되돌리기를 써서 라운드를 되살린다
  - SCN-ZRO-BIG-SWING       # 반경 3 으로 상대가 뭉쳐둔 자리를 쳐 25칸이 한 번에 넘어간다
  - SCN-ZRO-PINGPONG        # 같은 자리를 서로 되받아치다 이득이 줄어 다른 곳으로 옮긴다
  - SCN-ZRO-HOLD-WIN        # 판세는 밀렸지만 오래 들고 있어 누적 점수로 이긴다
  - SCN-ZRO-SAME-SHAPE      # 같은 모양을 받고도 놓는 자리가 갈려 승부가 난다
  - SCN-ZRO-EDGE-WASTE      # 가장자리에 놓아 판 밖으로 잘려 손해를 본다
  - SCN-ZRO-COMEBACK-TRAIL  # 초반에 크게 밀렸다가 후반에 뒤집은 궤적이 종료 화면에 남는다
  - SCN-ZRO-STRIPE-START    # 줄무늬 배치라 첫 수부터 어디를 쳐도 뺏는다
  - SCN-RNG-SAME-BOARD      # 이웃 시드가 안 갈라져 매판 같은 배치가 나온다 (교체 전 실제 증상)
  - SCN-TEXT-CLASH          # 요약이 격자 위로 올라타고 차례 줄이 배너를 파고든다 (수정 전 실제 증상)

  - SCN-COR-BAD-BALL        # 파워를 놓쳐 원이 크게 뜨고 헤더가 못 붙는다 → "공이 나빴다"
  - SCN-COR-LATE-RUN        # 원이 작았는데 헤더가 늦어 못 붙는다 → "늦게 붙었다"
  - SCN-COR-KEEPER-GAMBLE   # 존 안에 떨어졌는데 GK 가 못 닿아 빈 골문이 된다
  - SCN-COR-DEEP-SAFE-DULL  # 깊게 올려 아무도 안 왔지만 커버가 넓어 못 넣는다
  - SCN-COR-HALF-STEP       # 헤더가 수비수보다 반 발 먼저 닿아 경합에서 이긴다
