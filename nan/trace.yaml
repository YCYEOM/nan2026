  - TEST-COOP-HOLD          # rhythm.test "협동 홀드: 전원이 같이 누르고 유지하다…"
  - TEST-MASH-FILL          # rhythm.test "연타 노트: 담당이 창 안에서 필요 횟수만큼…"
  - TEST-CHART-UNEVEN       # rhythm.test "변칙 차트는 담당 노트 수가 플레이어마다 다르다…"
